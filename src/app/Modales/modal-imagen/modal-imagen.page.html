<ion-grid class="ion-no-padding" style="padding-top: 2px;height: 100%;overflow: hidden;width: 100%;">
  <ion-row id="anyStat" style="height: 100%;">
    <ion-col size="12">
      <br><br><br><br><br>
      <ion-img [src]="'data:image/jpeg;base64,'+foto" style="width: 100%; max-height: 60%;" [style.height]=imageHeight></ion-img>
      <ion-buttons style="position:absolute; top:3%; width: 100%;">
        <ion-grid style="width: 100%;">
          <ion-row style="">
            <ion-col size="6">
              <ion-button color="primary" (click)="dismissModal()">
                <ion-icon style="font-size: 2rem;" name="chevron-back"></ion-icon>
              </ion-button>
            </ion-col>
            <ion-col size="6" style="text-align: right;">
              <ion-button color="primary" (click)="saveNewDescription()">
                <ion-icon style="font-size: 2rem; font-weight: bolder;" name="checkmark"></ion-icon>
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
        
        
      </ion-buttons>
    </ion-col>
  </ion-row>
</ion-grid>

<ion-footer #fotoFooter id="fotoFooter">
  
  <br>
  

  <ion-textarea
  *ngIf="delete==false"
  mode="ios"
  [placeholder]=descripcion
  class="textArea"
  rows="4"
  [(ngModel)]="descripcionX"
  (ionChange)="setNewDescription()"
  >
  </ion-textarea>
  <!--ion-chip *ngIf="delete==false" class="button-chip" color="primary" (click)="saveNewDescription()">
    <ion-label>Guardar</ion-label>
  </!--ion-chip -->
  
</ion-footer>
