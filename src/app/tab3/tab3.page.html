

<ion-header>
  <ion-spinner color="primary" name="lines" *ngIf="isLoading == true"></ion-spinner>
  <ion-footer id="spinFooter" *ngIf="isLoading == true"></ion-footer>
  <ion-toolbar id="profile-toolbar">
       <ion-card style="height: 160px;">
         
         <ion-card-content>
           <ion-grid>
             <ion-row>
               <ion-col size="3">
                 <ion-avatar id="avatarPerfil"> 
                  <img *ngIf="user.Foto"  [src]="user.Foto" alt="" style="width: 90px; height:90px;"
                  (click)="openImg(user.Foto.split(',')[1])" onerror="this.src='../../assets/img/usuario.svg'">
                  <ion-icon *ngIf="user.Foto" name="camera" style="font-size:2rem;position: absolute;margin-top: 0.6vh;"
                  (click)="abrirCamara()"></ion-icon>
                  <ion-icon *ngIf="!user.Foto" color="tertiary" name="person-circle" style="font-size:5rem;position: static;"></ion-icon>
                  <ion-icon *ngIf="!user.Foto" name="camera" style="font-size:2rem;position: absolute;margin-top: 0.6vh;"
                  (click)="abrirCamara()"></ion-icon>
                 </ion-avatar>
               </ion-col>
               <ion-col size="9">
                 <h1 style="margin-top: -20px;" class="text-size-lg">{{user.NombreAgente}}</h1>
                 <p class="text-size-p">{{user.ProveedorName}}</p>
           <ion-col size="12" style="margin-top: -20px;">
             
               <ion-row>
                 <ion-col style="color: #3171e0;" size="3">Firma Actual Precargada</ion-col>
                 <ion-col size="8" style="margin-top: -20px;">
                  <img id="reloadSignatureButton" style="width: 60px; height:60px" src="../../assets/img/vista.gif" alt="search" (click)="firmarInspector(); modalSignAju.present()"/>
                   <!--ion-icon name="eye" style="font-size: 2rem; margin: 15px; color: #f14f23;" id="open-modal-sign-aju" (click)="recargarFirma()"></!--ion-icon -->
                 </ion-col>
                 <img src={{banderaPais}} (click)="'testApi()'" style="width: 50px; margin-left: -40px; margin-top: -80px; margin-bottom: 80px;">
                 <!--img src={{banderaPais}}
                 style="width: 50px; margin-left: 15px; margin-top: -10px; margin-bottom: 20px;" -->
               </ion-row>
             
           </ion-col>
               </ion-col>
               
             </ion-row>
           </ion-grid>
           
           <!-- <p class="text-size-p">{{user.Usuario}}</p>
           <p class="text-size-p">{{user.Movil}}</p> -->
           <ion-button style="
           right: 3vw; top:5vh; position: fixed; --background: transparent;--background-hover:transparent;" (click)="cerrarSesion()" fill="clear">
             <ion-icon style="color:#007cdc; font-size: 30px;" name="menu"></ion-icon>
           </ion-button>
         </ion-card-content>
       </ion-card>
 </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" style="color: #3171e0;">
        <ion-label style="margin-left: 19px;"> Guardar Firma Ajustador</ion-label>
      </ion-col>
      <ion-col size="12" style="margin-top: -10px;">
        <ion-card>
          <ion-card-content>
            <!--ion-img *ngIf="isSign == true" src="{{firmaPrecargada}}"/ -->
            <canvas id="canvasAjustador" width="{{deviceWidth}}" [height]="300"  #canvas3 style="border: 6px dashed #ede9e9"></canvas>
          </ion-card-content>
          <ion-grid>
            <ion-row>
              <ion-col size="6">
                <ion-button expand="block" (click)="clear()">Limpiar Firma</ion-button>
              </ion-col>
              <ion-col size="6">
                <ion-button expand="block" (click)="saveSignature()">Guardar Firma</ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-card>
      </ion-col>
      
    </ion-row>
  </ion-grid>
</ion-content>

<ion-modal #modalSignAju trigger="open-modal-sign-aju" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.5, 0.75, 1]">
  <ng-template>
    <ion-card>
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <ion-col size="12">
              <ion-item-divider>
                <ion-label> Firma Ajustador </ion-label>
              </ion-item-divider>
            </ion-col>
          </ion-row>
          <ion-row>
            
            <ion-col size="12">
              <ion-badge style="width: 100%;text-align: left;" *ngIf="!firmaPrecargadaInspector">Aun no se ha precargado una firma para el ajustador. <br>Puedes guardar una desde el panel de inicio.</ion-badge>
              <ion-img *ngIf="firmaPrecargadaInspector" src="{{firmaPrecargadaInspector}}"></ion-img>
            </ion-col>
          </ion-row>
        </ion-grid>
        </ion-card-content>
        
      </ion-card>
      <ion-grid style="width: 100%;">
        <ion-row>
          <ion-col size="6">
            <ion-button *ngIf="isSign == false" style="color: white;opacity: 0;" expand="block" (click)="clear()">Limpiar Firma</ion-button>
          </ion-col>
          <ion-col size="6">
            <ion-button expand="block" (click)="this.modalSignAju.dismiss()">Usar</ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
  </ng-template>
</ion-modal>

<ion-modal class="Img" #appointmentAlert [isOpen]="openFoto">
	<ng-template>
		<ion-content (click)="openFoto=false">
			<ion-img [src]="'data:image/jpeg;base64,'+foto"></ion-img>
		</ion-content>
	</ng-template>
</ion-modal>
