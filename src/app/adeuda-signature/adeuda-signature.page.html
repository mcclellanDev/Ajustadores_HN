<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button aria-label="Regresar al acuerdo" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Firma del deudor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false" class="debtor-signature-page">
  <main class="signature-workspace">
    <header class="signature-context">
      <img [src]="fsLogo" alt="Ficohsa Seguros" />
      <div>
        <span>Acuerdo de deuda - Atención #{{idAtencion}}</span>
        <h1>{{debtorName}}</h1>
        <p>Firme dentro del área blanca para confirmar la lectura y aceptación del reconocimiento de deuda.</p>
      </div>
    </header>

    <section class="signature-pad-shell" aria-label="Área de firma del deudor">
      <canvas #signatureCanvas></canvas>
    </section>

    <footer class="signature-controls">
      <ion-button fill="outline" (click)="clear()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Limpiar
      </ion-button>
      <ion-button (click)="save()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        Usar esta firma
      </ion-button>
    </footer>
  </main>
</ion-content>
