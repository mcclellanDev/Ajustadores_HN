<ion-header>
  <div class="audience-loading" *ngIf="isLoading">
    <ion-spinner color="primary" name="lines"></ion-spinner>
  </div>

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button aria-label="Regresar" (click)="goBack()">
        <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Audiencia · Atención #{{idAtencion}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="prepare-audience-content">
  <ion-accordion-group class="audience-form" [value]="['first']" *ngIf="!lawyerSearchOpen">
    <ion-accordion value="first" class="audience-section">
      <ion-item slot="header">
        <ion-label>Datos de abogado</ion-label>
      </ion-item>
      <div class="audience-section-content" slot="content">
        <div class="audience-field">
          <ion-label>Abogado asignado</ion-label>
          <button type="button" class="lawyer-picker" (click)="goSearch()">
            <ion-avatar>
              <img src="assets/iconos/ajustador-legal-halo-preview.svg" alt="" />
            </ion-avatar>
            <span>{{abogadoNombre}}</span>
            <ion-icon name="chevron-down-outline"></ion-icon>
          </button>
        </div>
      </div>
    </ion-accordion>

    <ion-accordion value="second" class="audience-section">
      <ion-item slot="header">
        <ion-label>Lugar de la audiencia</ion-label>
      </ion-item>
      <div class="audience-section-content" slot="content">
        <div class="audience-field">
          <ion-label>Lugar y observaciones</ion-label>
          <ion-textarea autoGrow="true" rows="3" [(ngModel)]="lugarAudiencia"
            placeholder="Indica el lugar donde se realizará la audiencia"></ion-textarea>
        </div>
      </div>
    </ion-accordion>

    <ion-accordion value="third" class="audience-section">
      <ion-item slot="header">
        <ion-label>Fecha de la audiencia</ion-label>
      </ion-item>
      <div class="audience-section-content" slot="content">
        <div class="audience-date-summary" *ngIf="formateadaAudiencia">
          <ion-icon name="calendar-outline"></ion-icon>
          <div>
            <span>Fecha seleccionada</span>
            <strong>{{formateadaAudiencia}}</strong>
          </div>
        </div>
        <div class="audience-field audience-field-wide">
          <ion-label>Seleccionar fecha y hora</ion-label>
          <div class="audience-datetime-panel">
            <ion-datetime presentation="date-time" locale="es-HN" [firstDayOfWeek]="1"
              size="cover" [(ngModel)]="fechaAudiencia" (ionChange)="marcarFechaAudiencia(fechaAudiencia)">
            </ion-datetime>
          </div>
        </div>
      </div>
    </ion-accordion>
  </ion-accordion-group>

  <section class="lawyer-search-panel" [class.is-open]="lawyerSearchOpen">
    <div class="lawyer-search-header">
      <ion-badge>Abogados en sistema</ion-badge>
      <ion-button id="closeAbogadosSearchButton" fill="clear" class="lawyer-search-close"
        (click)="closeAbogadosSearch()">
        <ion-icon slot="icon-only" name="return-up-back"></ion-icon>
      </ion-button>
    </div>

    <ion-searchbar animated="true" placeholder="Buscar abogado" show-clear-button="focus"
      [debounce]="400" (ionInput)="handleInput($event)"></ion-searchbar>

    <div class="lawyer-search-table-head">
      <span>Nombre de abogado(a)</span>
    </div>

    <ion-list lines="none" class="lawyer-search-list">
      <ion-item button detail="false" *ngFor="let abogado of results"
        (click)="selectAbogado(abogado.IdAjustador)">
        <ion-label>{{ abogado.AgenteNombre }}</ion-label>
      </ion-item>
    </ion-list>
  </section>
</ion-content>

<ion-footer class="audience-footer" *ngIf="!lawyerSearchOpen">
  <ion-toolbar>
    <ion-button id="submitAudience" expand="block" (click)="audienceSave()">
      Enviar audiencia
      <ion-icon slot="end" name="chevron-forward"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-footer>
