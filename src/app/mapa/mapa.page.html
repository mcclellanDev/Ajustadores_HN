<ion-header class="map-correction-header" *ngIf="coordinateCorrectionMode">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" aria-label="Volver" (click)="cerrarMapa()">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{mapTitle}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="map-correction-content" [fullscreen]="!coordinateCorrectionMode">
  <div id="map" class="manual-map"></div>


  <div class="map-top-overlay" *ngIf="coordinateCorrectionMode">
    <section class="map-search-card">
      <ion-icon name="search-outline"></ion-icon>
      <input #placeSearchInput type="text" autocomplete="off" placeholder="Buscar ubicación del siniestro" />
    </section>

    <section class="map-instruction-card" [class.map-instruction-card--collapsed]="instructionCollapsed">
      <div class="map-instruction-card__icon">
        <ion-icon name="location-outline"></ion-icon>
      </div>
      <div class="map-instruction-card__body">
        <strong>{{mapInstructionTitle}}</strong>
        <span *ngIf="!instructionCollapsed">{{mapInstructionText}}</span>
      </div>
      <button class="map-instruction-card__toggle" type="button" [attr.aria-label]="instructionCollapsed ? 'Mostrar indicaciones' : 'Ocultar indicaciones'" (click)="toggleInstructionCard()">
        <ion-icon [name]="instructionCollapsed ? 'chevron-down-outline' : 'chevron-up-outline'"></ion-icon>
      </button>
    </section>
  </div>
</ion-content>

<ion-footer class="map-correction-footer" *ngIf="coordinateCorrectionMode">
  <ion-button expand="block" fill="outline" class="map-secondary-button" (click)="cerrarMapa()">
    Cancelar
  </ion-button>
  <ion-button expand="block" class="map-primary-button" [disabled]="!hasSelectedCrashPoint" (click)="confirmarCambioUbicacion()">
    <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
    Confirmar ubicación
  </ion-button>
</ion-footer>
