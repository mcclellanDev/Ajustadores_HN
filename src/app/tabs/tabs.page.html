<ion-tabs color="tertiary">

  <ion-tab-bar color="tertiary">

    

    <ion-tab-button #inicio id="inicio" tab="tab1" (click)="handleNavigation(0)" 
    [disabled]="!gpsOn">
      <ion-icon name="apps-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" (click)="handleNavigation(1)"
    [disabled]="!gpsOn">
      <ion-icon name="search"></ion-icon>
      <ion-label>Mis Atenciones</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" (click)="handleNavigation(2)"
    [disabled]="!gpsOn">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
