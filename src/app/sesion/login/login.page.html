<ion-content class="login-page" [fullscreen]="true">
  <ion-spinner color="primary" name="lines" *ngIf="isLoading == true"></ion-spinner>
  <ion-footer id="spinFooter" *ngIf="isLoading == true"></ion-footer>

  <img id="olaArriba" class="login-wave login-wave-top" src="../../../assets/materiales/ola_arriba.svg" alt="" />
  <img id="olaAbajo" class="login-wave login-wave-bottom" src="../../../assets/materiales/ola_abajo.svg" alt="" />

  <main class="login-shell">
    <section class="login-brand" aria-label="HELP Ajustadores">
      <img id="logoHelp" class="login-logo" src="../../../assets/logos/help.png" alt="HELP" />
      <div class="login-brand-copy">
        <p>HELP Ajustadores</p>
        <h1>Acceso de ajustadores</h1>
      </div>
    </section>

    <section class="login-panel">
      <form (ngSubmit)="login()" [formGroup]="credenciales" id="loginform" class="login-form">
        <header class="login-form-header">
          <p>Iniciar sesión</p>
          <h2>Bienvenido</h2>
        </header>

        <label class="login-field-label" for="login-email">Correo electrónico</label>
        <ion-input
          id="login-email"
          class="sesion-dato"
          required
          type="email"
          formControlName="user"
          (ionChange)="walkEmail($event)"
          (ionBlur)="validateEmail()"
          [(ngModel)]="item.user"
          name="usernamevalue"
          placeholder="correo@dominio.com">
        </ion-input>

        <label class="login-field-label" for="login-password">Contraseña</label>
        <div class="password-field">
          <ion-input
            id="login-password"
            class="sesion-dato password-input"
            required
            [type]="isVisible ? 'text' : 'password'"
            formControlName="password"
            (ionChange)="validatePassword()"
            [(ngModel)]="item.password"
            placeholder="Clave de acceso">
          </ion-input>

          <ion-button class="password-toggle" fill="clear" type="button" (click)="toggleVisual()" aria-label="Mostrar u ocultar contraseña">
            <ion-icon [name]="isVisible ? 'eye-off' : 'eye'" aria-hidden="true"></ion-icon>
          </ion-button>
        </div>

        <ion-button class="login-submit ion-text-capitalize" expand="block" shape="round" type="submit" [disabled]="!credenciales.valid">
          Iniciar sesión
        </ion-button>

        <ion-button class="recovery-button ion-text-capitalize" expand="block" fill="clear" shape="round" type="button" (click)="recoveryPassword()">
          Recuperar contraseña
        </ion-button>
      </form>
    </section>
  </main>
</ion-content>

<ion-grid id="connectIndicatorLogin" class="connect-indicator" (click)="permitirGPS(conectividadStat)">
  <ion-row>
    <ion-col size="12">
      <ion-chip class="chip-connect">
        <ion-icon name="locate"></ion-icon>
        <ion-label>{{estadoConexionGPS}}</ion-label>
      </ion-chip>
    </ion-col>
  </ion-row>
</ion-grid>
