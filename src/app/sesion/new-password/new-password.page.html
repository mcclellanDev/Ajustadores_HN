<ion-content class="auth-page" [fullscreen]="true">
  <ion-spinner color="primary" name="lines" class="auth-spinner" *ngIf="isLoading"></ion-spinner>
  <div class="auth-loading-overlay" *ngIf="isLoading"></div>

  <img class="auth-wave auth-wave-top" src="../../../assets/materiales/ola_arriba.svg" alt="" />
  <img class="auth-wave auth-wave-bottom" src="../../../assets/materiales/ola_abajo.svg" alt="" />

  <main class="auth-shell">
    <section class="auth-brand" aria-label="HELP Ajustadores">
      <img class="auth-logo" src="../../../assets/logos/help.png" alt="HELP" />
      <div class="auth-brand-copy">
        <p>HELP Ajustadores</p>
        <h1>Nueva contraseña</h1>
      </div>
    </section>

    <section class="auth-panel">
      <form class="auth-form" (ngSubmit)="onDoneFunc()">
        <header class="auth-form-header">
          <p>Paso 3 de 3</p>
          <h2>Define tu clave</h2>
        </header>

        <p class="auth-form-copy">
          Crea una contraseña segura y confírmala para finalizar el proceso.
        </p>

        <div class="auth-email-chip" *ngIf="item.user">
          <ion-icon name="person-circle-outline"></ion-icon>
          <span>{{ item.user }}</span>
        </div>

        <label class="auth-field-label" for="new-password">Nueva contraseña</label>
        <div class="auth-password-field">
          <ion-input
            id="new-password"
            class="auth-input"
            [class.is-invalid]="passwordMatchState === 'mismatch'"
            [class.is-valid]="passwordMatchState === 'match'"
            [type]="isPasswordVisible ? 'text' : 'password'"
            autocomplete="new-password"
            [(ngModel)]="item.password"
            [ngModelOptions]="{standalone: true}"
            (ngModelChange)="onPasswordFieldsChange()"
            placeholder="Clave de acceso">
          </ion-input>
          <ion-button
            class="auth-password-toggle"
            fill="clear"
            type="button"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña">
            <ion-icon [name]="isPasswordVisible ? 'eye-off' : 'eye'"></ion-icon>
          </ion-button>
        </div>

        <label class="auth-field-label" for="confirm-password">Confirmar contraseña</label>
        <div class="auth-password-field">
          <ion-input
            id="confirm-password"
            class="auth-input"
            [class.is-invalid]="passwordMatchState === 'mismatch'"
            [class.is-valid]="passwordMatchState === 'match'"
            [type]="isConfirmVisible ? 'text' : 'password'"
            autocomplete="new-password"
            [(ngModel)]="item.confrim"
            [ngModelOptions]="{standalone: true}"
            (ngModelChange)="onPasswordFieldsChange()"
            placeholder="Repite la clave">
          </ion-input>
          <ion-button
            class="auth-password-toggle"
            fill="clear"
            type="button"
            (click)="toggleConfirmVisibility()"
            aria-label="Mostrar u ocultar confirmación">
            <ion-icon [name]="isConfirmVisible ? 'eye-off' : 'eye'"></ion-icon>
          </ion-button>
        </div>

        <div
          class="auth-match-feedback is-danger"
          *ngIf="passwordMatchState === 'mismatch'"
          role="status"
          aria-live="polite">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>Las contraseñas no coinciden.</span>
        </div>

        <div
          class="auth-match-feedback is-success"
          *ngIf="passwordMatchState === 'match'"
          role="status"
          aria-live="polite">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <span>Las contraseñas coinciden.</span>
        </div>

        <ion-button
          class="auth-primary-button ion-text-capitalize"
          expand="block"
          shape="round"
          type="submit"
          [disabled]="isLoading || !canSavePassword">
          Guardar contraseña
        </ion-button>

        <ion-button
          class="auth-secondary-button ion-text-capitalize"
          expand="block"
          fill="clear"
          shape="round"
          type="button"
          [routerLink]="fromApp ? '/tabs/tab3' : '/login'">
          Cancelar
        </ion-button>
      </form>
    </section>
  </main>
</ion-content>
